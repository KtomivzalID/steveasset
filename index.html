    document.getElementById('date-time').textContent = f;
}
setInterval(updateTime, 1000); updateTime();

function loadPhoto(event) {
    const photoFrame = document.getElementById('photo-frame');
    const reader = new FileReader();
    reader.onload = function() {
        const img = new Image();
        img.src = reader.result;
        img.style.width='100px'; img.style.height='120px'; img.style.borderRadius='5px';
        photoFrame.innerHTML=''; photoFrame.appendChild(img);
    };
    reader.readAsDataURL(event.target.files[0]);
}

document.addEventListener('DOMContentLoaded', () => {
    const groups = Array.from(document.querySelectorAll('.group-1,.group-2,.group-3,.group-4,.group-5,.group-6')).reverse();
    function startAnimation() {
        groups.forEach((g, i) => {
            g.style.animation = 'fadeWave 2s ease-in-out forwards';
            g.style.animationPlayState = 'running';
            g.style.animationDelay = `${i * 0.2}s`;
        });
        setTimeout(() => {
            groups.forEach(g => { g.style.animation = 'none'; });
            setTimeout(startAnimation, 2000);
        }, 4000);
    }
    startAnimation();
});
    </script>
</body>
</html>
